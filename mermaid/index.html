<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mermaid 图形推理查看器</title>
  <link rel="icon" href="../../favicon.webp">
  <script src="vendor/mermaid.min.js"></script>
  <script>
    (() => {
      const mobileQuery = window.matchMedia('(max-width: 760px) and (pointer: coarse)');
      const syncMobileMode = () => {
        document.documentElement.classList.toggle(
          'mobile-reading-mode',
          mobileQuery.matches && !window.electronAPI
        );
      };
      syncMobileMode();
      mobileQuery.addEventListener?.('change', syncMobileMode);
    })();
  </script>
  <link rel="stylesheet" href="mermaid-viewer.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div>
          <h1>Mermaid 图形推理查看器</h1>
        <p id="brandSubtitle">打开 Markdown 或 Mermaid 源文件，阅读或边编辑边预览</p>
        </div>
      </div>
      <div id="fileChangeNotice" class="file-change-notice" role="status" aria-live="polite" hidden>
        <span>已检测到 md 文件发生修改，是否更新？</span>
        <span class="file-change-actions">
          <button id="reloadFileButton" type="button">立即更新</button>
          <button id="ignoreFileButton" type="button">忽略</button>
        </span>
      </div>
      <div class="toolbar">
        <span id="modeBadge" class="mode-badge">阅读模式</span>
        <button id="openButton" class="primary" type="button">打开文件</button>
        <button id="editButton" type="button">编辑模式</button>
        <button id="visualButton" type="button">可视化编辑</button>
        <button id="saveButton" type="button" disabled>保存</button>
        <button id="saveAsButton" type="button" disabled>另存为</button>
        <span id="saveStatus" class="save-status" aria-live="polite"></span>
        <input id="fileInput" type="file" accept=".md,.mmd,.mermaid,.txt" hidden>
      </div>
    </header>

    <main class="content">
      <label id="dropzone" class="dropzone" for="fileInput">
        <span><strong>把源文件拖到这里</strong>，或者点击“打开文件”</span>
      </label>
      <div id="fileName" class="file-name">尚未打开文件</div>

      <section id="workspace" class="workspace">
        <section id="editorPanel" class="panel" hidden>
          <div class="panel-head"><strong>Mermaid 代码</strong><span>输入后自动更新</span></div>
          <textarea id="codeInput" spellcheck="false" aria-label="Mermaid 代码编辑区"></textarea>
        </section>

        <section id="visualPanel" class="panel visual-panel" hidden>
          <div class="panel-head"><strong>可视化编辑</strong><span>先建立格子，再拖拽连线</span></div>
          <div class="visual-toolbar" aria-label="可视化编辑工具">
            <button id="visualSelect" type="button" class="active">选择</button>
            <button id="addRectButton" type="button">＋矩形</button>
            <button id="addDiamondButton" type="button">＋菱形</button>
            <button id="connectButton" type="button">连接箭头</button>
            <button id="groupButton" type="button" disabled>创建分组</button>
            <span class="toolbar-separator"></span>
            <button id="layoutButton" type="button">自动布局</button>
            <button id="undoButton" type="button">撤销</button>
            <button id="redoButton" type="button">重做</button>
            <button id="closeVisualButton" type="button">返回阅读</button>
          </div>
          <div id="visualStatus" class="visual-status" role="status" aria-live="polite" hidden></div>
          <div id="visualError" class="visual-error" hidden></div>
          <div class="visual-canvas-wrap">
            <svg id="visualCanvas" class="mode-select" viewBox="0 0 1400 900" role="application" aria-label="Mermaid 可视化编辑画布"></svg>
            <div class="visual-hint">双击空白新建格子；拖动格子调整位置；选中箭头后拖动尖端修改指向；Ctrl+C 复制，Ctrl+V 粘贴到鼠标位置；右键从一个格子拖到另一个格子创建箭头</div>
          </div>
        </section>

        <aside id="visualInspector" class="panel visual-inspector" hidden>
          <div class="panel-head"><strong>属性</strong><span id="visualSelectionType">未选择</span></div>
          <div id="inspectorBody" class="inspector-body">
            <div class="inspector-empty">选择一个格子或箭头后，可以编辑文字、链接、图片和方向。</div>
          </div>
        </aside>

        <section class="panel diagram-panel">
          <div class="panel-head">
            <strong>图形预览</strong>
            <div class="diagram-tools" aria-label="图形缩放控制">
              <button id="zoomOut" type="button" aria-label="缩小">−</button>
              <span id="zoomLabel" class="zoom-label">100%</span>
              <button id="zoomIn" type="button" aria-label="放大">＋</button>
              <button id="zoomReset" type="button">重置</button>
            </div>
          </div>
          <div id="positionIndicator" class="position-indicator" aria-hidden="true">
            <div id="positionThumb" class="position-thumb"></div>
          </div>
          <div id="diagramScroll" class="diagram-scroll">
            <div id="diagramOutput" class="diagram-output">
              <div class="empty-state">
                <div>
                  <strong>等待 Mermaid 文件</strong>
                  <p>打开或拖入源文件后，会自动提取其中的 Mermaid 代码并显示在这里。</p>
                </div>
              </div>
            </div>
          </div>
        </section>
      </section>
    </main>
  </div>

  <script src="visual-model.js"></script>
  <script src="mermaid-viewer.js"></script>
</body>
</html>
